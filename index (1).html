<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaliPoke Market Board</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f7f8fa;color:#141820;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1500px;margin:0 auto;padding:20px}
  .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2f6df6,#12a565);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
  h1{font-size:18px;font-weight:650;letter-spacing:-.2px}
  .tag{color:#9ca3af;font-size:11px;font-weight:500}
  .live{display:inline-flex;align-items:center;gap:6px;color:#12a565;font-size:11px;font-weight:600;background:#e7f7ef;padding:4px 10px;border-radius:20px}
  .dot{width:7px;height:7px;border-radius:50%;background:#12a565;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .clock{color:#6b7280;font-size:12px;font-weight:500}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px;margin-bottom:16px}
  .kpi{background:#fff;border:1px solid #eceef1;border-radius:12px;padding:14px 16px}
  .kpi .lab{color:#6b7280;font-size:11px;font-weight:500;margin-bottom:6px}
  .kpi .val{font-size:26px;font-weight:680;letter-spacing:-.5px}
  .kpi .sub{font-size:11px;color:#9ca3af;margin-top:2px}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{background:#fff;border:1px solid #eceef1;color:#6b7280;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:550;cursor:pointer;font-family:inherit}
  .tab.on{background:#141820;color:#fff;border-color:#141820}
  .search{flex:1;min-width:180px}
  .search input{width:100%;padding:8px 12px;border:1px solid #eceef1;border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
  .board{background:#fff;border:1px solid #eceef1;border-radius:12px;overflow:hidden}
  .bhd,.row{display:grid;grid-template-columns:2.2fr 1fr 1fr 1.15fr .8fr .8fr;gap:10px;padding:12px 16px;align-items:center}
  .bhd{border-bottom:1px solid #eceef1;color:#9ca3af;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:#fff}
  .row{border-bottom:1px solid #eceef1;cursor:pointer;transition:background .1s}
  .row:hover{background:#fafbfc}.row:last-child{border-bottom:none}
  .prod{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{color:#9ca3af;font-size:11px;font-weight:500;margin-top:3px;display:flex;align-items:center;gap:7px}
  .tcgbadge{font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;background:#eef2ff;color:#2f6df6;text-transform:uppercase}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .cap{display:block;font-size:10px;margin-top:2px;font-weight:500;color:#9ca3af}
  .mkt{color:#e0900a;font-weight:650}
  .rival{font-weight:600}
  .rivalname{color:#2f6df6;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .up{color:#e0433c}.down{color:#12a565}
  .pill{display:inline-block;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:650}
  .foot{color:#9ca3af;font-size:11px;text-align:center;margin-top:14px;font-weight:500}
  .empty{padding:40px;text-align:center;color:#9ca3af}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div class="brand"><div class="mark">CP</div><div><h1>CaliPoke Market Board</h1><div class="tag">Live pricing vs TCGplayer market · all TCG</div></div></div>
    <div style="display:flex;align-items:center;gap:12px"><span class="live"><span class="dot"></span><span id="shopcount">Live</span></span><span class="clock" id="clock">—</span></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="bar">
    <div class="tabs" id="tabs">
      <div class="tab on" data-f="all">All</div>
      <div class="tab" data-f="over">Over market</div>
      <div class="tab" data-f="under">Under market</div>
      <div class="tab" data-f="beaten">Beaten</div>
      <div class="tab" data-f="thin">Thin margin</div>
    </div>
    <div class="search"><input id="q" placeholder="Search products…" oninput="render()"></div>
  </div>
  <div class="board">
    <div class="bhd"><div>Product</div><div class="num">Market</div><div class="num">Our price</div><div class="num">Best rival</div><div class="num">vs Mkt</div><div class="num">Margin</div></div>
    <div id="rows"><div class="empty">Loading live data…</div></div>
  </div>
  <div class="foot" id="foot">Connect Firebase to go live · click any product for the full competitor breakdown</div>
</div>

<script>
/* ---- SAMPLE DATA (replaced by Firebase when configured) ---- */
let DATA = [
 {p:"151 Booster Box",set:"SV2a",tcg:"pkm-jp",us:527.33,mkt:328.80,rival:421.16,comp:"monketic",sold:33345,cost:260,h:[520,522,527,527,527]},
 {p:"Shiny Treasure ex",set:"SV4a",tcg:"pkm-jp",us:160.68,mkt:138.80,rival:151.94,comp:"monketic",sold:36943,cost:123.97,h:[168,166,164,162,161]},
 {p:"VStar Universe",set:"S12a",tcg:"pkm-jp",us:275.33,mkt:237.38,rival:245.46,comp:"gregs-game-shop",sold:10222,cost:199,h:[275,275,275,275,275]},
 {p:"Eevee Terastal Festival",set:"SV8a",tcg:"pkm-jp",us:167.33,mkt:159.90,rival:166.73,comp:"monketic",sold:23807,cost:126.21,h:[169,168,168,167,167]},
 {p:"Mega Dream ex",set:"M2a",tcg:"pkm-jp",us:152.33,mkt:141.20,rival:156.68,comp:"777cards",sold:6162,cost:87,h:[150,151,152,152,152]},
 {p:"Mega Brave",set:"M1L",tcg:"pkm-jp",us:115.79,mkt:111.81,rival:104.99,comp:"monketic",sold:7148,cost:93.23,h:[118,117,116,116,116]},
 {p:"Battle Partners",set:"SV9",tcg:"pkm-jp",us:92.33,mkt:88.40,rival:88.99,comp:"777cards",sold:4832,cost:71.60,h:[93,93,92,92,92]},
 {p:"Inferno X M2",set:"M2",tcg:"pkm-jp",us:218.33,mkt:201.50,rival:187.57,comp:"gregs-game-shop",sold:2464,cost:117.28,h:[215,216,218,218,218]},
 {p:"Night Wanderer",set:"SV6a",tcg:"pkm-jp",us:105.33,mkt:96.20,rival:87.16,comp:"monketic",sold:1510,cost:40.09,h:[105,105,105,105,105]},
 {p:"Ruler of the Black Flame",set:"SV10",tcg:"pkm-jp",us:180.33,mkt:171.00,rival:157.12,comp:"poke-texas-tcg",sold:2809,cost:26.21,h:[182,181,180,180,180]},
 {p:"Lost Abyss",set:"S11",tcg:"pkm-jp",us:325.33,mkt:498.00,rival:524.54,comp:"monketic",sold:991,cost:59.42,h:[320,322,325,325,325]},
 {p:"Wild Force",set:"SV5K",tcg:"pkm-jp",us:93.33,mkt:98.10,rival:102.54,comp:"kwonpiece",sold:1371,cost:34.50,h:[93,93,93,93,93]},
 {p:"OP-11 A Fist of Divine Speed",set:"OP11",tcg:"one-piece",us:161.33,mkt:150.20,rival:155.00,comp:"kwonpiece",sold:1200,cost:73.76,h:[163,162,161,161,161]},
 {p:"EB-02 Anime 25th Collection",set:"EB02",tcg:"one-piece",us:160.79,mkt:148.00,rival:149.99,comp:"packflipps",sold:900,cost:69.50,h:[162,161,160,160,160]},
];
const $=i=>document.getElementById(i),M=n=>'$'+(n==null?0:n).toFixed(2),P=(a,b)=>((a-b)/b*100);
function spark(h){if(!h||h.length<2)return'';const w=60,ht=17,mn=Math.min(...h),mx=Math.max(...h),r=(mx-mn)||1,t=h[h.length-1]-h[0];
  const c=t>0?'#e0433c':t<0?'#12a565':'#c3c9d2';
  const pts=h.map((v,i)=>`${(i/(h.length-1)*w).toFixed(1)},${(ht-((v-mn)/r)*(ht-3)-1.5).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${ht}" viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.5"/></svg>`;}
function mgnPct(r){return r.cost?((r.us-r.cost)/r.us*100):null;}
let f='all';
function render(){
  const q=($('q').value||'').toLowerCase();
  let rows=DATA.filter(r=>!q||r.p.toLowerCase().includes(q)||(r.set||'').toLowerCase().includes(q));
  if(f==='over')rows=rows.filter(r=>r.mkt&&r.us>r.mkt);
  if(f==='under')rows=rows.filter(r=>r.mkt&&r.us<r.mkt);
  if(f==='beaten')rows=rows.filter(r=>r.rival&&r.rival<r.us);
  if(f==='thin')rows=rows.filter(r=>{const m=mgnPct(r);return m!==null&&m<30;});
  const withMkt=DATA.filter(r=>r.mkt);
  const over=withMkt.filter(r=>r.us>r.mkt).length,under=withMkt.filter(r=>r.us<r.mkt).length;
  const avg=withMkt.length?withMkt.reduce((s,r)=>s+P(r.us,r.mkt),0)/withMkt.length:0;
  $('kpis').innerHTML=[['Products',DATA.length,'tracked',''],['Over market',over,'priced above TCG','up'],['Room to raise',under,'below market','down'],['Avg vs market',(avg>0?'+':'')+avg.toFixed(0)+'%','across catalog',avg>0?'up':'down']]
    .map(k=>`<div class="kpi"><div class="lab">${k[0]}</div><div class="val ${k[3]}">${k[1]}</div><div class="sub">${k[2]}</div></div>`).join('');
  if(!rows.length){$('rows').innerHTML='<div class="empty">No products match.</div>';return;}
  $('rows').innerHTML=rows.map(r=>{
    const hasM=r.mkt!=null;const vs=hasM?P(r.us,r.mkt):null,o=vs>0,beat=r.rival&&r.rival<r.us,m=mgnPct(r);
    const mtxt=m===null?'<span style="color:#c3c9d2">—</span>':`<span style="font-weight:650;color:${m>=40?'#12a565':m>=25?'#e0900a':'#e0433c'}">${m.toFixed(0)}%</span>`;
    const vspill=hasM?`<span class="pill" style="background:${o?'#fdeceb':'#e7f7ef'};color:${o?'#e0433c':'#12a565'}">${o?'+':''}${vs.toFixed(0)}%</span>`:'<span style="color:#c3c9d2">—</span>';
    return `<div class="row" onclick="pick('${r.p.replace(/'/g,'')} ${r.set||''}')">
      <div class="prod">${r.p}<div class="meta"><span class="tcgbadge">${(r.tcg||'').replace('pkm-','pkm ')}</span>${r.set||''} · ${(r.sold||0).toLocaleString()} sold ${spark(r.h)}</div></div>
      <div class="num mkt">${hasM?M(r.mkt):'—'}<span class="cap">TCG market</span></div>
      <div class="num rival">${M(r.us)}<span class="cap">our price</span></div>
      <div class="num">${r.rival?`<span class="rival ${beat?'up':''}">${M(r.rival)}</span><span class="cap rivalname">${r.comp}</span>`:'<span style="color:#c3c9d2">—</span>'}</div>
      <div class="num">${vspill}</div>
      <div class="num">${mtxt}</div>
    </div>`;}).join('');
}
function pick(name){ if(window.sendPrompt) sendPrompt('/allprices '+name); }
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');f=t.dataset.f;render();});
function ck(){$('clock').textContent=new Date().toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
ck();setInterval(ck,30000);

/* ---- FIREBASE (fill in your config to go live) ---- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAFC2veHk0E8a15UfS1oUlXUNn7Ey_gTDc",
  authDomain: "calipoke-market.firebaseapp.com",
  databaseURL: "https://calipoke-market-default-rtdb.firebaseio.com",
  projectId: "calipoke-market",
  storageBucket: "calipoke-market.firebasestorage.app",
  messagingSenderId: "976219088599",
  appId: "1:976219088599:web:8c17f00d081cd77a6cb292"
};
if(FIREBASE_CONFIG){
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.database().ref('board').on('value',s=>{
    const v=s.val();
    if(v&&Array.isArray(v.products)){DATA=v.products;$('foot').textContent='Live · updated '+(v.updated||'');$('shopcount').textContent='Live · '+(v.shops||11)+' shops';}
    render();
  });
}else{ render(); }
</script>
</body>
</html>
